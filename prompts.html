<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookworms HTML</title>
    <link rel="icon" href="bookwormIconFinal.ico" />
    <link rel="stylesheet" href="prompts.css"/>
    <link rel="stylesheet" href="foundation.css"> 
  </head>
  <body>
    <header>
        <h1 class="banner">
          <img class="bannerImage" src="bannerBookworm.jpg" alt="Bookworms Banner">
          <span class="wavy">Bookworms</span>
        </h1>
        <nav>
            <menu>
              <flex class="navButtonContainer"><a class="navButton" href= "index.html">Home</a></flex>
              <flex class="navButtonContainer"><a class="navButton" href="prompts.html">Prompt</a></flex>
              <flex class="navButtonContainer"><a class="navButton" href= "feed.html">Response Feed</a></flex>
              <flex class="navButtonContainer"><a class="navButton" href= "profile.html">Profile</a></flex>
              <flex class="navButtonContainer"><a class="navButton" href= "about.html">About</a></flex>
            </menu>
        </nav>
    </header>
    
    <main>
      <div class="promptContainer" id="dropFirst">
        <h1>~Daily Prompt~</h1>
        <p>"Two friends realize they are characters in a comic; one is the hero, one the villain..."</p>
      </div>
      <div class="bonusContainer" id="dropSecond">
        <h3>
          <span>daily bonuses:</span>
        </h3>
        <p>⭐️ use the word "intergalactic"</p>
        <p>⭐️ set in the future</p>
        <p>⭐️ make one character a cowboy</p>         
      </div>
      <form method="get" action="feed.html" class="responseForm">
          <input type="text" placeholder="type here..." />
        <button type="submit">Publish</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Abigail Peterson</span>
      <br />
      <a href="https://github.com/abbiesue/Bookworms">GitHub</a>
    </footer>

  </body>
</html>
