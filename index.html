<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookworms HTML</title>
    <link rel="icon" href="bookwormIconFinal.ico" />
    <link rel="stylesheet" href="foundation.css">   
  </head>
  <body>
    <header>
        <h1 class="banner">
          <img class="bannerImage" src="bannerBookworm.jpg" alt="Bookworms Banner">
          <span>Bookworms</span>
        </h1>
        <nav>
            <menu>
              <flex><a class="navButton" href= "index.html">Home</a></flex>
              <flex><a class="navButton" href="prompts.html">Prompt</a></flex>
              <flex><a class="navButton" href= "feed.html">Response Feed</a></flex>
              <flex><a class="navButton" href= "profile.html">Profile</a></flex>
              <flex><a class="navButton" href= "about.html">About</a></flex>
            </menu>
        </nav>
    </header>
    
    <main>
      <h1>Welcome to Bookworms!</h1>
      <h2>Login to get started:</h2>
      <form method="get" action="prompts.html">
        <div>
          <span>@</span>
          <input type="text" placeholder="your@email.com" />
        </div>
        <div>
          <span>🔒</span>
          <input type="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
        <button type="submit">Create</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Abigail Peterson</span>
      <br />
      <a href="https://github.com/abbiesue/Bookworms">GitHub</a>
    </footer>

  </body>
