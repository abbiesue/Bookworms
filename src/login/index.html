<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookworms HTML</title>
    <link rel="icon" href="bookwormIconFinal.ico" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="foundation.css">  
    <link rel="stylesheet" href="index.css">  
  </head>
  <body>
    <header>
        <h1 class="banner">
          <img class="bannerImage" src="bannerBookworm.jpg" alt="Bookworms Banner">
          <span>Bookworms</span>
        </h1>
    </header>
    
    <main>
      <h1>
        Welcome to
        <span class="wavy">Bookworms</span>
      </h1>
      <div class="loginPrompt">
        <h2>Log in to get started:</h2>
        <form method="get" action="prompts.html">
          <div class="mb-3">
            <label for="emailInput" class="form-label">email:</label>
            <input type="text" placeholder="your@email.com" />
          </div>
          <div>
            <label for="passwordInput" class="form-label">password:</label>
            <input type="password" placeholder="password" />
          </div>
          <button type="submit">Login</button>
          <button type="submit">Create</button>
        </form>
      </div>

    </main>

    <footer>
      <hr />
      <span class="text-reset">Abigail Peterson</span>
      <br />
      <a href="https://github.com/abbiesue/Bookworms">GitHub</a>
    </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
